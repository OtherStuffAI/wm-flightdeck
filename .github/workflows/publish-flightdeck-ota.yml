name: Publish Flight Deck OTA feed

on:
  push:
    branches:
      - flightdeck-release
  workflow_dispatch:

concurrency:
  group: flightdeck-ota-production
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Derive reproducible release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct HEAD)"
          source_commit="$(git rev-parse HEAD)"
          short_commit="${source_commit:0:12}"
          build_id="ota-${source_epoch}-${short_commit}"
          tag="flightdeck-${source_epoch}"
          {
            echo "source_epoch=$source_epoch"
            echo "source_commit=$source_commit"
            echo "build_id=$build_id"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build Flight Deck deterministically
        env:
          FLIGHTDECK_BUILD_NUMBER: ${{ steps.release.outputs.source_epoch }}
          FLIGHTDECK_BUILD_ID: ${{ steps.release.outputs.build_id }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_epoch }}
        run: |
          bun run build
          bun run verify:dist

      - name: Run publisher contract tests
        run: bunx vitest run tests/deterministic-build-version.test.js tests/package-ota-release.test.js

      - name: Package immutable OTA release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          node scripts/package-ota-release.mjs \
            --dist dist \
            --out ota-release \
            --archive-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --source-commit "$SOURCE_COMMIT" \
            --minimum-wmapp-version 0.1.2 \
            --minimum-native-bridge 1 \
            --channel flightdeck-release \
            --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

      - name: Refuse to overwrite an immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable assets will not be overwritten." >&2
            exit 1
          fi

      - name: Publish immutable archive and digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          gh release create "$RELEASE_TAG" \
            ota-release/*.tar.gz \
            ota-release/*.tar.gz.sha256 \
            ota-release/manifest.json \
            ota-release/manifest.json.sha256 \
            --target "$SOURCE_COMMIT" \
            --title "Flight Deck ${RELEASE_TAG}" \
            --notes "Verified Flight Deck OTA build from ${SOURCE_COMMIT}."

      - name: Stage stable channel manifest for GitHub Pages
        run: |
          mkdir -p pages/stable
          cp ota-release/manifest.json pages/manifest.json
          cp ota-release/manifest.json.sha256 pages/manifest.json.sha256
          cp ota-release/manifest.json pages/stable/manifest.json
          cp ota-release/manifest.json.sha256 pages/stable/manifest.json.sha256

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload stable feed
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages

      - name: Promote stable feed
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
