name: Source validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLIGHT_DECK_PG_APP_NPUB: npub1hd37reqgfcnz3pvzj4grknd2nkzc94p9ercmunrxx22razr2rfxsw6dns5

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run source checks
        run: |
          bun run lint
          bun run check:public-source
          bun run test

      - name: Build and verify dist
        run: |
          source_epoch="$(git show -s --format=%ct HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          export FLIGHTDECK_BUILD_NUMBER="$source_epoch"
          export FLIGHTDECK_BUILD_ID="ci-${source_epoch}-${short_commit}"
          export SOURCE_DATE_EPOCH="$source_epoch"
          bun run build
          bun run verify:dist
          git diff --check
